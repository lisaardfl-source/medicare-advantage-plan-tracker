    CountyRateBenchmark:
      type: object
      description: Monthly CMS Medicare Advantage county capitation benchmarks from the CMS MA Rate Book.
      required:
        - year
        - cms_county_code
        - rate_5_star
        - rate_3_5_star
        - rate_0_star
        - esrd_rate
      properties:
        year:
          type: number
          description: CMS rate-book year
        cms_county_code:
          type: string
          description: CMS county rate code, which is distinct from a county FIPS code
        rate_5_star:
          type: number
          description: Monthly Parts A and B benchmark for 5% quality bonus plans
        rate_3_5_star:
          type: number
          description: Monthly Parts A and B benchmark for 3.5% quality bonus plans
        rate_0_star:
          type: number
          description: Monthly Parts A and B benchmark without a quality bonus
        esrd_rate:
          type: number
          description: Monthly ESRD dialysis benchmark after the CMS user-fee deduction

